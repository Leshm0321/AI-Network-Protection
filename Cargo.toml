[package]
name = "ai-network-protection"
version = "0.1.0"
edition = "2024"
description = "Read-only AI network, leak, and local environment diagnostic Windows & macOS desktop app powered by Native Shell (NSH)"
publish = false

[workspace]

[lib]
name = "ai_network_protection"
path = "src/lib.rs"

[[bin]]
name = "AI-Network-Protection"
path = "src/main.rs"

[dependencies]
nsh-core = "0.6.1"
nsh-base = { version = "0.6.1", default-features = false }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "http2", "charset"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
iana-time-zone = "0.1"
sys-locale = "0.3"
dirs = "6"
url = "2"
rand = "0.8"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false }

[dev-dependencies]
nsh-engine = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
